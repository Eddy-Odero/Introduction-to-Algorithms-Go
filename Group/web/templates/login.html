{{template "base" .}}
{{define "content"}}
<div class="post-creation-card">
    <div class="card" style="padding: 2.5rem;">
        <h2 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem;">Welcome Back</h2>
        <p style="text-align: center; color: #9ca3af; margin-bottom: 2rem;">Sign in to join the conversation</p>

        {{if .Error}}
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
            {{.Error}}
        </div>
        {{end}}

        <form action="/login" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-block" style="background: #3b82f6; color: white;">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #9ca3af; font-size: 0.9rem;">
            Don't have an account? <a href="/register" style="color: #3b82f6; font-weight: 600;">Register</a>
        </p>
    </div>
</div>
{{end}}
