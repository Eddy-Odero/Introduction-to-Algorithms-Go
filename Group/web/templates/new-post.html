{{template "base" .}}
{{define "content"}}
<div class="feed-column">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
        <h2 style="margin-bottom: 1.5rem;">Create New Post</h2>

        {{if .Error}}
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem;">
            {{.Error}}
        </div>
        {{end}}

        <form action="/new-post" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #9ca3af;">Title</label>
                <input type="text" name="title" placeholder="What's on your mind?" required
                       style="padding: 0.65rem; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #f3f4f6; font-family: inherit;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #9ca3af;">Content</label>
                <textarea name="content" placeholder="Write your full post here..." rows="8" required
                          style="padding: 0.65rem; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #f3f4f6; font-family: inherit; resize: vertical;"></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #9ca3af;">Categories (comma separated)</label>
                <input type="text" name="category" placeholder="Tech, Golang, Web"
                       style="padding: 0.65rem; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #f3f4f6; font-family: inherit;">
            </div>

            <button type="submit" style="padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 0.5rem;">
                Publish Post
            </button>
        </form>
    </div>
</div>

<aside class="sidebar-column"></aside>
{{end}}
